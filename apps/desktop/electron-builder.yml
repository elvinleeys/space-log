# 설치 파일 만들기. electron-vite가 만든 out/ 을 포장한다 (npm run dist)
appId: com.spacelog.desktop
productName: Spacelog
directories:
  output: dist
files:
  - out/**
  - resources/**
  - package.json
  # main·preload는 Electron과 Node 기본 모듈만 쓰고, renderer는 이미 묶여 있다
  - '!node_modules/**'
# 트레이·Dock 아이콘은 파일 경로로 읽으므로 묶음(asar) 밖에 둔다
asarUnpack:
  - resources/**
# 아이콘 원본은 docs/design/logo/desktop
mac:
  # 개발자 인증서가 없어 만든 사람을 밝히지 않는 임시 서명(ad-hoc)을 한다. 서명이 아예 깨져 있으면 Apple 칩 맥에서 '손상됨'으로 막힌다
  identity: '-'
  # 강화 런타임은 공증(notarization)에만 필요하고, 임시 서명과 함께 켜면 앱이 뜨지 않을 수 있다
  hardenedRuntime: false
  icon: resources/icon.icns
  # Apple 칩(arm64)과 Intel(x64) 맥용을 따로 만든다
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.productivity
win:
  icon: resources/icon.ico
  target: nsis
linux:
  icon: resources/icon.png
  target: AppImage
